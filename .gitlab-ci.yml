include:
  - project: 'devsecops/gitlab-ci-common'
    ref: master
    file: '/template/build_and_sign.yml'

release_build_and_sign:
  stage: build
  extends: .build_and_sign_jdk17
  variables:
    variants: "civ"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

test_github_release_publisher:
  stage: .pre
  image: node:22-bookworm-slim
  before_script: []
  script:
    - node --test ci/publish-github-release.test.mjs

publish_github_pipeline_release:
  stage: .post
  image: node:22-bookworm-slim
  before_script:
    - |
      case "${CI_DEBUG_TRACE:-false}" in
        true|TRUE|1|yes|YES)
          echo "ERROR: Disable CI_DEBUG_TRACE before publishing"
          exit 1
          ;;
      esac
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends apksigner aapt
  dependencies:
    - release_build_and_sign
  resource_group: dashboard-github-rolling-release
  interruptible: false
  environment:
    name: github-rolling-release
  script:
    - node ci/publish-github-release.mjs
  rules:
    - if: '$CI_SERVER_HOST == "git.tak.gov" && $CI_PROJECT_ID == "6557" && $CI_PROJECT_PATH == "aegorsuch/atak-plugin-physiology-dashboard" && $CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"'
